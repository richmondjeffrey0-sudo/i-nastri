name: Deploy I NASTRI

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare I NASTRI content and theme
        run: |
          if [ -d content/content-snapshot ]; then
            cp -R content/content-snapshot/. content/
            rm -rf content/content-snapshot
          fi
          if [ -f content/Index.md ]; then
            mv content/Index.md content/index.md
          fi
          cp .github/workflows/custom.scss quartz/styles/custom.scss
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Prepare I NASTRI post metadata
        run: python3 .github/workflows/build_home.py --prepare
      - name: Build site
        run: npx quartz build
      - name: Build I NASTRI artwork homepage
        run: |
          python3 .github/workflows/build_home.py
          test -f public/inastri-home.css
          grep -q 'class="post"' public/index.html
          rm -rf _site
          mkdir _site
          cp -R public/. _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
