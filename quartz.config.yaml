# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: I NASTRI
  pageTitleSuffix: " — Richmond Jeffrey"
  enableSPA: true
  enablePopovers: false
  analytics: null
  locale: en-US
  baseUrl: richmondjeffrey0-sudo.github.io/i-nastri
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: Cormorant Garamond
      header: Cormorant Garamond
      body: Source Sans 3
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f7f5ed"
        lightgray: "#d8d3c8"
        gray: "#aaa398"
        darkgray: "#3b3933"
        dark: "#24231f"
        secondary: "#8c4c28"
        tertiary: "#64351e"
        highlight: "rgba(140, 76, 40, 0.10)"
        textHighlight: "#eadf9a88"
      darkMode:
        light: "#1d1c19"
        lightgray: "#34312b"
        gray: "#777168"
        darkgray: "#d9d4c9"
        dark: "#f3eee3"
        secondary: "#d79a70"
        tertiary: "#efb98e"
        highlight: "rgba(215, 154, 112, 0.12)"
        textHighlight: "#70652188"

plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - medium
        - dimensions
        - location
        - status
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: published
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40

  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: github:quartz-community/description
    enabled: true
    order: 70

  - source: github:quartz-community/fonts
    enabled: true

  - source: github:quartz-community/remove-draft
    enabled: true

  - source: github:quartz-community/alias-redirects
    enabled: true

  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: github:quartz-community/favicon
    enabled: true

  - source: github:quartz-community/og-image
    enabled: true

  - source: github:quartz-community/content-page
    enabled: true

  - source: github:quartz-community/folder-page
    enabled: true

  - source: github:quartz-community/tag-page
    enabled: true

  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10

  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20

  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 30

  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
    condition: not-index

  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
    condition: not-index

  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
    condition: not-index

  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      limit: 20
      showTags: true
    layout:
      position: afterBody
      priority: 10
    condition: index

  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        RSS: /index.xml

layout:
  groups: {}
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
    bases: {}
